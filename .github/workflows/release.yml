name: Release

# release: <default> (release title)
# dispatch (all): Manual release for $target_release_tag
# dispatch (specified): Manual release for $target_release_tag (subproject: $target_subproject)
run-name: |-
  ${{ github.event_name == 'workflow_dispatch' && format('Manual release for {0}{1}', inputs.target_release_tag, inputs.target_subproject && format(' (subproject: {0})', inputs.target_subproject) || '') || '' }}

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      target_subproject:
        description: |-
          The subproject name(s) of the specified Minecraft version to be released, seperated with ",".
          By default all subprojects will be released
        type: string
        required: false
        default: ''
      target_release_tag:
        description: |-
          The tag of the release you want to append the artifact to.
          It must be an existing tag, otherwise publishing will fail.
        type: string
        required: true

permissions:
  contents: write

env:
  BUILD_TYPE: release

jobs:
  show_action_parameters:
    runs-on: ubuntu-latest
    steps:
      - name: Show action parameters
        run: |
          cat <<EOF > $GITHUB_STEP_SUMMARY
          ## Action Parameters
          - target_subproject: \`\${{ github.event.inputs.target_subproject }}\`
          - target_release_tag: \`\${{ github.event.inputs.target_release_tag }}\`
          EOF

  matrix_prep:
    uses: ./.github/workflows/matrix_prep.yml
    with:
      target_subproject: ${{ github.event.inputs.target_subproject }}

  changelog:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate publish related information
        id: release_info_for_changelog
        run: |
          if [ $GITHUB_EVENT_NAME == 'release' ]
          then
              echo "tag_name=" >> $GITHUB_OUTPUT
          elif [ $GITHUB_EVENT_NAME == 'workflow_dispatch' ]
          then
              echo "tag_name=${{ github.event.inputs.target_release_tag }}" >> $GITHUB_OUTPUT
          else
              echo Unknown github event name $GITHUB_EVENT_NAME
              exit 1
          fi

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Generate changelog
        run: git-cliff --latest -o CHANGELOG.md

      - name: Upload changelog to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info_for_changelog.outputs.tag_name }}
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate_release:
    runs-on: ubuntu-latest
    needs: changelog
    steps:
      - name: Get github release information
        uses: cardinalby/git-get-release-action@1.2.5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag: ${{ github.event.inputs.target_release_tag }}

  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    needs:
      - validate_release
    with:
      build_type: release
      download_dependencies: true
      publish: false
      target_subproject: ${{ github.event.inputs.target_subproject }}

  release:
    continue-on-error: true
    needs:
      - matrix_prep
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix: ${{ fromJson(needs.matrix_prep.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Display context
        run: |
          echo ref_name = ${{ github.ref_name }}
          echo target_subproject = ${{ github.event.inputs.target_subproject }}
          echo target_release_tag = ${{ github.event.inputs.target_release_tag }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: build-artifacts

      - name: Get github release information
        id: get_release
        uses: cardinalby/git-get-release-action@1.2.5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag: ${{ github.event.inputs.target_release_tag }}

      - name: Generate publish related information
        id: release_info
        run: |
          if [ $GITHUB_EVENT_NAME == 'release' ]
          then
              echo "tag_name=" >> $GITHUB_OUTPUT
          elif [ $GITHUB_EVENT_NAME == 'workflow_dispatch' ]
          then
              echo "tag_name=${{ github.event.inputs.target_release_tag }}" >> $GITHUB_OUTPUT
          else
              echo Unknown github event name $GITHUB_EVENT_NAME
              exit 1
          fi

      - name: Get repo info
        id: properties_repo
        shell: bash
        run: |
          # The compatibility fork uses main rather than the upstream mojmaps/preprocessor branch.
          # Derive the mod version from the selected release tag (e.g. v1.0.0-mc26.3 -> 1.0.0).
          RELEASE_TAG="${{ github.event.inputs.target_release_tag || github.ref_name }}"
          MOD_VERSION="${RELEASE_TAG#v}"
          MOD_VERSION="${MOD_VERSION%-mc*}"
          if [[ -z "$MOD_VERSION" || "$MOD_VERSION" == "$RELEASE_TAG" ]]; then
              echo "Could not derive mod version from release tag: $RELEASE_TAG"
              exit 1
          fi
          echo "MOD_VERSION=$MOD_VERSION"
          echo "mod_version=$MOD_VERSION" >> "$GITHUB_OUTPUT"

      - name: Read common properties
        id: properties_g
        uses: BrycensRanch/read-properties-action@v1
        with:
          file: gradle.properties
          all: true

      - name: Read version-specific properties
        id: properties_v
        uses: BrycensRanch/read-properties-action@v1
        with:
          file: ${{ format('versions/{0}/gradle.properties', matrix.subproject) }}
          all: true

      - name: Prepare file information
        id: file_info
        run: |
          shopt -s extglob
          FILE_PATHS=(build-artifacts/${{ matrix.subproject }}/build/libs/!(*-@(dev|sources|shadow)).jar)
          if (( ${#FILE_PATHS[@]} != 1 )); then
              echo "Error: Found ${#FILE_PATHS[@]} files, expected exactly 1"
              exit 1
          fi
          FILE_PATH="${FILE_PATHS[0]}"
          FILE_NAME=$(basename "$FILE_PATH")
          FILE_HASH=$(sha256sum "$FILE_PATH" | awk '{ print $1 }')
          echo "path=$FILE_PATH" >> $GITHUB_OUTPUT
          echo "name=$FILE_NAME" >> $GITHUB_OUTPUT
          echo "hash=$FILE_HASH" >> $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT

      - name: Prepare changelog
        uses: actions/github-script@v9
        id: changelog
        with:
          script: return process.env.CHANGELOG
          result-encoding: string
        env:
          CHANGELOG: |-
            ${{ steps.get_release.outputs.body }}

            -------

            Build Information

            - File name: \`${{ steps.file_info.outputs.name }}\`
            - SHA-256: \`${{ steps.file_info.outputs.hash }}\`
            - Built from: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Publish Minecraft Mods
        uses: Kira-NT/mc-publish@v3.3
        with:
          modrinth-id: pWSdI9vn
          modrinth-token: ${{ secrets.MODRINTH_API_TOKEN }}
          curseforge-id: 1566301
          curseforge-token: ${{ secrets.CURSEFORGE_API_TOKEN }}
          github-tag: ${{ steps.release_info.outputs.tag_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: ${{ steps.file_info.outputs.path }}
          name: ${{ format('{0} v{1} for mc{2}', steps.properties_g.outputs.mod_name, steps.properties_repo.outputs.mod_version, steps.properties_v.outputs.minecraft_version) }}
          version: ${{ format('v{1}-mc{0}', steps.properties_v.outputs.minecraft_version, steps.properties_repo.outputs.mod_version) }}
          version-type: release
          loaders: fabric
          game-versions: ${{ steps.properties_v.outputs.game_versions }}
          game-version-filter: any
          dependencies: ''
          github-changelog: ${{ steps.get_release.outputs.body }}
          modrinth-changelog: ${{ steps.changelog.outputs.result }}
          curseforge-changelog: ${{ steps.changelog.outputs.result }}
          retry-attempts: 3
          retry-delay: 10000
